name: Email sync dispatcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: email-sync-cron
  cancel-in-progress: false

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: anchi-gemavi
            base_url: https://anchi-gemavi.vercel.app
            secret_name: CRON_SECRET_GEMAVI
          - project: anchi-tan
            base_url: https://anchi-tan.vercel.app
            secret_name: CRON_SECRET_TAN
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake due email synchronizations
        env:
          TARGET_PROJECT: ${{ matrix.project }}
          CRON_BASE_URL: ${{ matrix.base_url }}
          CRON_SECRET: ${{ secrets[matrix.secret_name] }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CRON_BASE_URL:-}" || -z "${CRON_SECRET:-}" ]]; then
            echo "Missing URL or cron secret for ${TARGET_PROJECT}."
            exit 1
          fi

          base_url="${CRON_BASE_URL%/}"
          response_file="${RUNNER_TEMP}/email-sync-response.json"
          http_code="$(curl \
            --silent \
            --show-error \
            --max-time 210 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Accept: application/json" \
            --header "x-cron-secret: ${CRON_SECRET}" \
            "${base_url}/cron/email-sync")"

          if [[ "$http_code" != 2* ]]; then
            echo "Email sync endpoint for ${TARGET_PROJECT} returned HTTP ${http_code}."
            exit 1
          fi

          echo "Email sync endpoint for ${TARGET_PROJECT} completed with HTTP ${http_code}."
