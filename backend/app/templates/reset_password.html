<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ request.state.csrf_token if request.state.csrf_token is defined else '' }}"><title>Nueva contraseña · {{ app_settings.app_name }}</title><link rel="stylesheet" href="{{ asset_url('styles.css') }}"><script src="{{ asset_url('js/security.js') }}" defer></script></head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="reset-title">
    <div class="auth-brand">{{ app_settings.app_name }}</div>
    <span class="eyebrow">Seguridad</span>
    <h1 id="reset-title">Define una nueva contraseña</h1>
    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="stack">
      <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token if request.state.csrf_token is defined else '' }}">
      <label>Nueva contraseña<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
      <button class="button" type="submit">Guardar contraseña</button>
    </form>
  </main>
</body>
</html>
